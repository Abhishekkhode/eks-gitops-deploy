apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-gitops-deploy
  namespace: production
  labels:
    app: eks-gitops-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eks-gitops-deploy
  template:
    metadata:
      labels:
        app: eks-gitops-deploy
    spec:
      containers:
        - name: eks-gitops-deploy
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: AWS_REGION
              value: "ap-south-2"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "100m"
              memory: "160Mi"
            limits:
              cpu: "300m"
              memory: "320Mi"
          # Readiness probe checks application health before serving traffic
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness probe restarts pod if unhealthy
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
