id: eks_gitops_deploy_pipeline
namespace: prod.deployments
description: Spring Boot CI/CD pipeline with EKS health checks and Discord alerts

concurrency:
  behavior: QUEUE
  limit: 1

inputs:
  - id: git_repo
    type: STRING
    defaults: "https://github.com/your-username/eks-gitops-deploy.git"
    description: Git repository URL

  - id: git_branch
    type: STRING
    defaults: "main"
    description: Branch to build and deploy

  - id: aws_region
    type: STRING
    defaults: "ap-south-2"
    description: AWS Destination Region

  - id: ecr_registry
    type: STRING
    defaults: "your-account-id.dkr.ecr.ap-south-2.amazonaws.com"
    description: AWS ECR Registry URI

  - id: eks_cluster_name
    type: STRING
    defaults: "eks-gitops-deploy-cluster"
    description: Target EKS Cluster Name

tasks:
  - id: working_dir
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      # Clone repository
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.git_repo | trim }}"
        branch: "{{ inputs.git_branch | trim }}"

      # Build and push image
      - id: build_and_push_image
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: gcr.io/kaniko-project/executor:debug
        env:
          AWS_ACCESS_KEY_ID: "{{ kv('AWS_ACCESS_KEY_ID') ?? secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ kv('AWS_SECRET_ACCESS_KEY') ?? secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_REGION: "{{ inputs.aws_region | trim }}"
        commands:
          - /kaniko/executor --context dir://. --dockerfile Dockerfile --destination {{ inputs.ecr_registry | trim }}/eks-gitops-deploy:{{ execution.id }} --custom-platform=linux/amd64 --ignore-path=/tmp

      # Deploy and verify rollout
      - id: deploy_and_verify_rollout
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: alpine/k8s:1.31.0
        env:
          AWS_ACCESS_KEY_ID: "{{ kv('AWS_ACCESS_KEY_ID') ?? secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ kv('AWS_SECRET_ACCESS_KEY') ?? secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ inputs.aws_region | trim }}"
          DISCORD_WEBHOOK_URL: "{{ kv('DISCORD_WEBHOOK_URL') ?? secret('DISCORD_WEBHOOK_URL') }}"
        commands:
          - aws eks update-kubeconfig --region {{ inputs.aws_region | trim }} --name {{ inputs.eks_cluster_name | trim }}
          - kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
          - sed -i "s|IMAGE_PLACEHOLDER|{{ inputs.ecr_registry | trim }}/eks-gitops-deploy:{{ execution.id }}|g" k8s/deployment.yaml
          - kubectl apply -f k8s/
          - kubectl rollout status deployment/eks-gitops-deploy -n production --timeout=420s
          # Discord success notification
          - |
            LB_HOST=$(kubectl get svc eks-gitops-deploy-service -n production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -z "$LB_HOST" ]; then
              LB_HOST=$(kubectl get svc eks-gitops-deploy-service -n production -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "Pending...")
            fi
            POD_SUMMARY=$(kubectl get pods -n production -l app=eks-gitops-deploy -o wide --no-headers 2>/dev/null | awk '{print "• "$1" ("$3", Ready: "$2") on Node: "$7}' | head -n 5)
            REPLICAS=$(kubectl get deployment eks-gitops-deploy -n production -o jsonpath='{.status.readyReplicas}/{\.spec.replicas}' 2>/dev/null || echo "2/2")
            
            jq -n \
              --arg cluster "{{ inputs.eks_cluster_name }}" \
              --arg region "{{ inputs.aws_region }}" \
              --arg ns "production" \
              --arg img "{{ inputs.ecr_registry }}/eks-gitops-deploy:{{ execution.id }}" \
              --arg execId "{{ flow.id }} - {{ execution.id }}" \
              --arg lb "http://$LB_HOST" \
              --arg pods "$POD_SUMMARY" \
              --arg reps "$REPLICAS Ready" \
              '{
                username: "eks-gitops-deploy Bot",
                avatar_url: "https://kestra.io/logo.png",
                embeds: [
                  {
                    title: "🚀 AWS EKS Deployment SUCCESS",
                    description: "**Application**: `eks-gitops-deploy` successfully deployed and rolled out to **production** on AWS EKS.",
                    color: 3066993,
                    fields: [
                      {
                        name: "🌐 Live Service LoadBalancer URL",
                        value: $lb,
                        inline: false
                      },
                      {
                        name: "📦 Container Image",
                        value: ("`" + $img + "`"),
                        inline: false
                      },
                      {
                        name: "🎯 Infrastructure Details",
                        value: ("• **Cluster**: `" + $cluster + "`\n• **Namespace**: `" + $ns + "`\n• **Region**: `" + $region + "`"),
                        inline: true
                      },
                      {
                        name: "📊 Pod Health & Sizing",
                        value: ("• **Replicas**: `" + $reps + "`\n• **CPU/RAM**: `100m-300m / 160Mi-320Mi`\n• **Probes**: Liveness & Readiness UP"),
                        inline: true
                      },
                      {
                        name: "📋 Active Pod Instances",
                        value: ("```text\n" + (if $pods != "" then $pods else "All pods healthy" end) + "\n```"),
                        inline: false
                      },
                      {
                        name: "🔗 Telemetry Endpoints Hub",
                        value: ("[Discovery Map](" + $lb + "/) • [Live System Stats](" + $lb + "/api/system) • [Actuator Health](" + $lb + "/actuator/health) • [App Info](" + $lb + "/api/info)"),
                        inline: false
                      }
                    ],
                    footer: {
                      text: ("Kestra GitOps Orchestrator • Execution: " + $execId)
                    },
                    timestamp: (now | todate)
                  }
                ]
              }' > /tmp/discord_success.json
            
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              curl -s -H "Content-Type: application/json" -X POST -d @/tmp/discord_success.json "$DISCORD_WEBHOOK_URL"
            fi

# Error handler
errors:
  - id: capture_pod_diagnostics_and_alert
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: alpine/k8s:1.31.0
    env:
      AWS_ACCESS_KEY_ID: "{{ kv('AWS_ACCESS_KEY_ID') ?? secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ kv('AWS_SECRET_ACCESS_KEY') ?? secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region | trim }}"
      DISCORD_WEBHOOK_URL: "{{ kv('DISCORD_WEBHOOK_URL') ?? secret('DISCORD_WEBHOOK_URL') }}"
    commands:
      - |
        set +e
        aws eks update-kubeconfig --region {{ inputs.aws_region | trim }} --name {{ inputs.eks_cluster_name | trim }} || true
        echo "=== CAPTURING DEPLOYMENT DIAGNOSTICS ==="
        POD_STATUS=$(kubectl get pods -n production -l app=eks-gitops-deploy 2>&1 | head -n 6 | head -c 800)
        CRASH_LOGS=$(kubectl logs deployment/eks-gitops-deploy -n production --tail=15 --all-containers=true 2>&1 | head -c 800)
        EVENTS=$(kubectl get events -n production --sort-by='.metadata.creationTimestamp' 2>&1 | tail -n 6 | head -c 800)
        
        [ -z "$POD_STATUS" ] && POD_STATUS="No pod status available"
        [ -z "$CRASH_LOGS" ] && CRASH_LOGS="No container logs available"
        [ -z "$EVENTS" ] && EVENTS="No recent events"

        jq -n \
          --arg cluster "{{ inputs.eks_cluster_name }}" \
          --arg region "{{ inputs.aws_region }}" \
          --arg ns "production" \
          --arg img "{{ inputs.ecr_registry }}/eks-gitops-deploy:{{ execution.id }}" \
          --arg execId "{{ flow.id }} - {{ execution.id }}" \
          --arg podStatus "$POD_STATUS" \
          --arg crashLogs "$CRASH_LOGS" \
          --arg events "$EVENTS" \
          '{
            username: "eks-gitops-deploy Alert",
            avatar_url: "https://kestra.io/logo.png",
            embeds: [
              {
                title: "🚨 AWS EKS Deployment FAILED",
                description: ("Deployment failed during verification/rollout on cluster **" + $cluster + "**."),
                color: 15158332,
                fields: [
                  {
                    name: "🎯 Infrastructure & Context",
                    value: ("• **Cluster**: `" + $cluster + "`\n• **Namespace**: `" + $ns + "`\n• **Region**: `" + $region + "`\n• **Attempted Image**: `" + $img + "`"),
                    inline: false
                  },
                  {
                    name: "📋 Pod Health & Diagnostics",
                    value: ("```text\n" + $podStatus + "\n```"),
                    inline: false
                  },
                  {
                    name: "📜 Recent Crash / Error Logs",
                    value: ("```text\n" + $crashLogs + "\n```"),
                    inline: false
                  },
                  {
                    name: "⚠️ Cluster Events",
                    value: ("```text\n" + $events + "\n```"),
                    inline: false
                  }
                ],
                footer: {
                  text: ("Kestra GitOps Orchestrator • Execution: " + $execId)
                },
                timestamp: (now | todate)
              }
            ]
          }' > /tmp/discord_failure.json

        if [ -n "$DISCORD_WEBHOOK_URL" ]; then
          echo "Sending incident embed to Discord..."
          curl -s -H "Content-Type: application/json" -X POST -d @/tmp/discord_failure.json "$DISCORD_WEBHOOK_URL"
        else
          echo "Warning: DISCORD_WEBHOOK_URL is not set!"
        fi

triggers:
  - id: github_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "github-push-secret-key"
