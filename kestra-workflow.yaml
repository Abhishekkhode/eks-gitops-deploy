id: eks_gitops_deploy_pipeline
namespace: prod.deployments
description: Spring Boot CI/CD pipeline with EKS health checks and Discord alerts

inputs:
  - id: git_repo
    type: STRING
    defaults: "https://github.com/Abhishekkhode/eks-gitops-deploy.git"
    description: Git repository URL

  - id: git_branch
    type: STRING
    defaults: "main"
    description: Branch to build and deploy

  - id: aws_region
    type: STRING
    defaults: "ap-south-2"
    description: AWS Destination Region

  - id: ecr_registry
    type: STRING
    defaults: "733048623802.dkr.ecr.ap-south-2.amazonaws.com"
    description: AWS ECR Registry URI

  - id: eks_cluster_name
    type: STRING
    defaults: "eks-gitops-deploy-cluster"
    description: Target EKS Cluster Name

tasks:
  - id: working_dir
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      # Clone Git repository
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.git_repo | trim }}"
        branch: "{{ inputs.git_branch | trim }}"

      # Build Docker image and push to AWS ECR
      - id: build_and_push_image
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        containerImage: alpine/k8s:1.31.0
        env:
          AWS_ACCESS_KEY_ID: "{{ kv('AWS_ACCESS_KEY_ID') ?? secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ kv('AWS_SECRET_ACCESS_KEY') ?? secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ inputs.aws_region | trim }}"
        commands:
          - apk add --no-cache docker-cli
          - aws ecr get-login-password --region {{ inputs.aws_region | trim }} | docker login --username AWS --password-stdin {{ inputs.ecr_registry | trim }}
          - docker build --platform linux/amd64 -t {{ inputs.ecr_registry | trim }}/eks-gitops-deploy:{{ execution.id }} .
          - docker push {{ inputs.ecr_registry | trim }}/eks-gitops-deploy:{{ execution.id }}

      # Deploy to EKS and verify rollout
      - id: deploy_and_verify_rollout
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: alpine/k8s:1.31.0
        env:
          AWS_ACCESS_KEY_ID: "{{ kv('AWS_ACCESS_KEY_ID') ?? secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ kv('AWS_SECRET_ACCESS_KEY') ?? secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ inputs.aws_region | trim }}"
        commands:
          - aws eks update-kubeconfig --region {{ inputs.aws_region | trim }} --name {{ inputs.eks_cluster_name | trim }}
          - kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
          - sed -i "s|IMAGE_PLACEHOLDER|{{ inputs.ecr_registry | trim }}/eks-gitops-deploy:{{ execution.id }}|g" k8s/deployment.yaml
          - kubectl apply -f k8s/
          - kubectl rollout status deployment/eks-gitops-deploy -n production --timeout=180s

      # Send success notification to Discord
      - id: notify_success
        type: io.kestra.plugin.notifications.discord.DiscordIncomingWebhook
        url: "{{ kv('DISCORD_WEBHOOK_URL') ?? secret('DISCORD_WEBHOOK_URL') }}"
        payload: |
          {
            "username": "Kestra SRE Bot",
            "content": "🚀 **Deployment SUCCESS**\n• **Cluster**: `{{ inputs.eks_cluster_name }}`\n• **Image**: `{{ inputs.ecr_registry }}/eks-gitops-deploy:{{ execution.id }}`\n• **Execution**: `{{ flow.id }} - {{ execution.id }}`"
          }

# Run on failure to fetch pod logs and send alert
errors:
  - id: capture_pod_diagnostics
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: alpine/k8s:1.31.0
    env:
      AWS_ACCESS_KEY_ID: "{{ kv('AWS_ACCESS_KEY_ID') ?? secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ kv('AWS_SECRET_ACCESS_KEY') ?? secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region | trim }}"
    commands:
      - aws eks update-kubeconfig --region {{ inputs.aws_region | trim }} --name {{ inputs.eks_cluster_name | trim }}
      - echo "=== POD STATUS ==="
      - kubectl get pods -n production -l app=eks-gitops-deploy
      - echo "=== CRASH LOGS ==="
      - kubectl logs deployment/eks-gitops-deploy -n production --tail=50 --all-containers=true || true
      - echo "=== POD EVENTS ==="
      - kubectl get events -n production --sort-by='.metadata.creationTimestamp' | tail -n 20 || true

  - id: notify_discord_incident
    type: io.kestra.plugin.notifications.discord.DiscordIncomingWebhook
    url: "{{ kv('DISCORD_WEBHOOK_URL') ?? secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "username": "Kestra SRE Alert",
        "content": "🚨 **Deployment FAILED**\n• **Cluster**: `{{ inputs.eks_cluster_name }}`\n• **Execution**: `{{ flow.id }} - {{ execution.id }}`"
      }

triggers:
  - id: github_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "github-push-secret-key"
